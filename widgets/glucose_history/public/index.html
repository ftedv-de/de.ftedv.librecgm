<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: transparent;
      color: var(--homey-text-color, #fff);
      box-sizing: border-box;
    }

    * { box-sizing: border-box; }

    body { padding: 10px; }

    #content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .current-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .current {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-shrink: 0;
      min-width: 160px;
    }

    .value {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    .unit {
      font-size: 13px;
      opacity: .7;
    }

    .trend {
      font-size: 24px;
      line-height: 1;
    }

    .freshness {
      font-size: 10px;
      opacity: .65;
      white-space: nowrap;
    }

    .freshness.stale,
    .freshness.error {
      color: #f57c00;
      opacity: 1;
    }

    .stats-group {
      flex: 1;
      display: flex;
      justify-content: space-around;
      gap: 18px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .label {
      font-size: 10px;
      opacity: .6;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }

    .chart-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      opacity: .7;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="content" class="empty">
    ...
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const trendMap = {
        falling_quickly: '↓',
        falling: '↘',
        flat: '→',
        rising: '↗',
        rising_quickly: '↑',
        unknown: '–',
      };
      const translate = (key, fallback) => Homey.__(`widgets.${key}`) || fallback;

      function getUnitSettings() {
        const settings = Homey.getSettings();
        const unit = settings.glucose_unit || 'mgdl';

        return {
          unit,
          label: unit === 'mmol' ? 'mmol/L' : 'mg/dL',
          valueKey: unit === 'mmol' ? 'valueMmol' : 'valueMgDl',
          statSuffix: unit === 'mmol' ? 'Mmol' : 'MgDl',
          decimals: unit === 'mmol' ? 1 : 0,
        };
      }

      function getHistoryRangeHours() {
        const settings = Homey.getSettings();
        const hours = Number(settings.history_range_hours || 24);

        return [6, 12, 24].includes(hours)
          ? hours
          : 24;
      }

      function formatValue(value, decimals) {
        if (!Number.isFinite(value)) {
          return '–';
        }

        return Number(value).toFixed(decimals);
      }

      function calculateVisibleStats(points, unitSettings) {
        const values = points
          .map(point => Number(point[unitSettings.valueKey]))
          .filter(Number.isFinite);

        if (!values.length) {
          return {
            min: null,
            avg: null,
            max: null,
          };
        }

        return {
          min: Math.min(...values),
          avg: values.reduce((sum, value) => sum + value, 0) / values.length,
          max: Math.max(...values),
        };
      }

      function calculateTimeInRange(points, targetRange) {
        const durations = { low: 0, inRange: 0, high: 0 };
        let covered = 0;
        const addDuration = (point, duration) => {
          const value = Number(point?.valueMgDl);
          if (!Number.isFinite(value) || duration <= 0 || duration > 15 * 60000) return;
          covered += duration;
          if (value < targetRange.lowMgDl) durations.low += duration;
          else if (value > targetRange.highMgDl) durations.high += duration;
          else durations.inRange += duration;
        };

        for (let index = 0; index < points.length - 1; index += 1) {
          const start = new Date(points[index].timestamp).getTime();
          const end = new Date(points[index + 1].timestamp).getTime();
          if (Number.isFinite(start) && Number.isFinite(end)) {
            addDuration(points[index], end - start);
          }
        }

        const lastPoint = points.at(-1);
        const lastTimestamp = new Date(lastPoint?.timestamp).getTime();
        if (Number.isFinite(lastTimestamp)) {
          addDuration(lastPoint, Date.now() - lastTimestamp);
        }

        return covered ? Math.round((durations.inRange / covered) * 100) : null;
      }

      function smoothChartPoints(points, windowMs) {
        const halfWindowMs = windowMs / 2;

        return points.map(point => {
          const from = point.time - halfWindowMs;
          const to = point.time + halfWindowMs;

          const values = points
            .filter(other =>
              other.time >= from &&
              other.time <= to
            )
            .map(other => other.chartValue)
            .filter(Number.isFinite);

          return {
            ...point,
            smoothedValue: values.length
              ? values.reduce((sum, value) => sum + value, 0) / values.length
              : point.chartValue,
          };
        });
      }

      function drawChart(canvas, points, unitSettings, targetRange) {
        const ctx = canvas.getContext('2d');

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;

        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;

        ctx.scale(devicePixelRatio, devicePixelRatio);
        ctx.clearRect(0, 0, width, height);

        const now = Date.now();
        const rangeHours = getHistoryRangeHours();
        const start = now - rangeHours * 60 * 60 * 1000;
        const timeRange = now - start;

        const validPoints = points
          .map(point => ({
            ...point,
            time: new Date(point.timestamp).getTime(),
            chartValue: Number(point[unitSettings.valueKey]),
          }))
          .filter(point =>
            Number.isFinite(point.time) &&
            Number.isFinite(point.chartValue)
          );

        const visiblePoints = validPoints
          .filter(point =>
            point.time >= start &&
            point.time <= now
          );

        if (visiblePoints.length < 2) {
          return;
        }

        const settings = Homey.getSettings();
        const smoothChart = settings.smooth_chart !== false;

        const smoothedPoints = smoothChart
          ? smoothChartPoints(visiblePoints, 15 * 60 * 1000)
          : [];

        const paddingLeft = 42;
        const paddingBottom = 18;
        const paddingTop = 6;
        const paddingRight = 6;

        const chartWidth =
          width - paddingLeft - paddingRight;

        const chartHeight =
          height - paddingTop - paddingBottom;

        const targetLow = unitSettings.unit === 'mmol'
          ? targetRange.lowMmol
          : targetRange.lowMgDl;
        const targetHigh = unitSettings.unit === 'mmol'
          ? targetRange.highMmol
          : targetRange.highMgDl;
        const values = visiblePoints.map(point => point.chartValue);

        if (Number.isFinite(targetLow)) values.push(targetLow);
        if (Number.isFinite(targetHigh)) values.push(targetHigh);

        const min =
          Math.min(...values);

        const max =
          Math.max(...values);

        const range =
          Math.max(0.1, max - min);

        if (Number.isFinite(targetLow) && Number.isFinite(targetHigh)) {
          const top = paddingTop + chartHeight - ((targetHigh - min) / range) * chartHeight;
          const bottom = paddingTop + chartHeight - ((targetLow - min) / range) * chartHeight;
          ctx.fillStyle = 'rgba(76, 175, 80, 0.12)';
          ctx.fillRect(paddingLeft, top, chartWidth, bottom - top);
        }

        ctx.strokeStyle =
          'rgba(128,128,128,0.3)';

        ctx.lineWidth = 1;

        const yDivisions = 4;

        for (let i = 0; i <= yDivisions; i++) {
          const y =
            paddingTop +
            (chartHeight / yDivisions) * i;

          ctx.beginPath();
          ctx.moveTo(paddingLeft, y);
          ctx.lineTo(width - paddingRight, y);
          ctx.stroke();
        }

        ctx.fillStyle =
          'rgba(128,128,128,0.9)';

        ctx.font =
          '10px system-ui';

        ctx.textAlign =
          'right';

        ctx.textBaseline =
          'middle';

        Array.from({ length: yDivisions + 1 }, (_, index) =>
          max - ((range / yDivisions) * index)
        ).forEach((value, index) => {
          const y =
            paddingTop +
            (chartHeight / yDivisions) * index;

          ctx.fillText(
            formatValue(value, unitSettings.decimals),
            paddingLeft - 6,
            y
          );
        });

        ctx.textAlign =
          'center';

        ctx.textBaseline =
          'top';

        const xDivisions = rangeHours === 6 ? 6 : 2;
        const xLabels = Array.from({ length: xDivisions + 1 }, (_, index) => {
          const hoursAgo = rangeHours - ((rangeHours / xDivisions) * index);
          return `${Math.round(hoursAgo)}h`;
        });

        xLabels.forEach((label, index) => {
          const x =
            paddingLeft +
            (chartWidth / xDivisions) * index;

          ctx.beginPath();
          ctx.moveTo(x, paddingTop);
          ctx.lineTo(x, paddingTop + chartHeight);
          ctx.stroke();

          ctx.fillText(
            label,
            x,
            height - paddingBottom + 4
          );
        });

        function pointToCanvas(point, value) {
          return {
            x:
              paddingLeft +
              ((point.time - start) / timeRange) * chartWidth,

            y:
              paddingTop +
              chartHeight -
              ((value - min) / range) * chartHeight,
          };
        }

        function drawLine(pointsToDraw, valueSelector, strokeStyle, lineWidth) {
          ctx.lineWidth = lineWidth;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.beginPath();

          let started = false;
          let previousTime = null;

          pointsToDraw.forEach(point => {
            if (point.time < start || point.time > now) {
              return;
            }

            const value =
              valueSelector(point);

            if (!Number.isFinite(value)) {
              return;
            }

            const p =
              pointToCanvas(point, value);

            if (!started || (previousTime !== null && point.time - previousTime > 15 * 60000)) {
              ctx.moveTo(p.x, p.y);
              started = true;
            } else {
              ctx.lineTo(p.x, p.y);
            }

            previousTime = point.time;
          });

          ctx.strokeStyle = strokeStyle;
          ctx.stroke();
        }

        if (smoothChart) {
          drawLine(
            visiblePoints,
            point => point.chartValue,
            'rgba(255, 152, 0, 0.4)',
            1
          );

          drawLine(
            smoothedPoints,
            point => point.smoothedValue,
            'rgba(255, 152, 0, 0.95)',
            2
          );
        } else {
          drawLine(
            visiblePoints,
            point => point.chartValue,
            'rgba(255, 152, 0, 0.95)',
            2
          );
        }

        visiblePoints.forEach(point => {
          const quickTrend = point.trend === 'rising_quickly' ||
            point.trend === 'falling_quickly';
          const outsideRange = point.chartValue < targetLow || point.chartValue > targetHigh;
          if (!quickTrend && !outsideRange) return;

          const position = pointToCanvas(point, point.chartValue);
          ctx.beginPath();
          ctx.arc(position.x, position.y, quickTrend ? 3 : 2.5, 0, Math.PI * 2);
          ctx.fillStyle = point.chartValue < targetLow
            ? '#e53935'
            : point.chartValue > targetHigh ? '#fb8c00' : '#7e57c2';
          ctx.fill();
        });
      }

      function render(data) {
        const content = document.getElementById('content');

        const current = data.current;
        const history = data.history || [];
        const unitSettings = getUnitSettings();
        const rangeHours = getHistoryRangeHours();
        const now = Date.now();
        const start = now - rangeHours * 60 * 60 * 1000;

        const visibleHistory = history.filter(point => {
          const time = new Date(point.timestamp).getTime();

          return (
            Number.isFinite(time) &&
            time >= start &&
            time <= now
          );
        });

        const visibleStats =
          calculateVisibleStats(
            visibleHistory,
            unitSettings
          );

        const readingTime = new Date(current?.timestamp).getTime();
        const ageMinutes = Number.isFinite(readingTime)
          ? Math.max(0, Math.floor((now - readingTime) / 60000))
          : null;
        const connectionError = data.status?.connectionError;
        const freshnessClass = connectionError
          ? 'error'
          : ageMinutes > 15 ? 'stale' : '';
        const freshnessText = connectionError
          ? translate('connection_error', 'Connection error')
          : ageMinutes === null
            ? ''
            : translate('minutes_ago', '__minutes__ min ago')
              .replace('__minutes__', ageMinutes);
        const targetRange = data.targetRange || {
          lowMgDl: 70,
          highMgDl: 180,
          lowMmol: 3.9,
          highMmol: 10,
        };
        const timeInRange = calculateTimeInRange(visibleHistory, targetRange);

        if (!current) {
          content.className = 'empty';
          content.textContent = translate('no_data', 'No glucose values available yet.');
          return;
        }

        content.className = '';

        content.innerHTML = `
          <div class="current-row">
            <div class="current">
              <span class="value">
                ${formatValue(current[unitSettings.valueKey], unitSettings.decimals)}
              </span>

              <span class="unit">
                ${unitSettings.label}
              </span>

              <span class="trend">
                ${trendMap[current.trend] || '–'}
              </span>

              <span class="freshness ${freshnessClass}">
                ${freshnessText}
              </span>
            </div>

            <div class="stats-group">
              <div class="stat">
                <div class="label">${translate('min', 'Min')}</div>
                <div class="stat-value">
                  ${formatValue(visibleStats.min, unitSettings.decimals)}
                </div>
              </div>

              <div class="stat">
                <div class="label">${translate('average', 'Avg')}</div>
                <div class="stat-value">
                  ${formatValue(visibleStats.avg, unitSettings.decimals)}
                </div>
              </div>

              <div class="stat">
                <div class="label">${translate('max', 'Max')}</div>
                <div class="stat-value">
                  ${formatValue(visibleStats.max, unitSettings.decimals)}
                </div>
              </div>
              <div class="stat">
                <div class="label">${translate('time_in_range', 'In range')}</div>
                <div class="stat-value">${timeInRange === null ? '–' : `${timeInRange}%`}</div>
              </div>
            </div>
          </div>

          <div class="chart-container">
            <canvas id="chart"></canvas>
          </div>
        `;

        drawChart(
          document.getElementById('chart'),
          history,
          unitSettings,
          targetRange
        );
      }

      async function refresh() {
        try {
          const deviceIds =
            await Homey.getDeviceIds();

          const deviceId =
            Array.isArray(deviceIds)
              ? deviceIds[0]
              : deviceIds;

          const data =
            await Homey.api(
              'GET',
              `/getGlucoseHistory?deviceId=${encodeURIComponent(deviceId || '')}`
            );

          render(data);

        } catch (err) {
          const content =
            document.getElementById('content');

          content.className =
            'empty';

          content.textContent =
            translate('connection_error', 'Connection error');
        }
      }

      Homey.ready();

      document.getElementById('content').textContent =
        translate('loading', 'Loading glucose values...');
      refresh();

      Homey.on('settings', () => {
        refresh();
      });

      setInterval(
        refresh,
        60 * 1000
      );
    }
  </script>

  <script
    src="/homey.js"
    data-origin="widget">
  </script>
</body>
</html>
