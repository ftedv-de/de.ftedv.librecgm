<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: transparent;
      color: var(--homey-text-color, #fff);
      box-sizing: border-box;
    }

    * { box-sizing: border-box; }

    body { padding: 10px; }

    #content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .current {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      min-width: 140px;
    }

    .value-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .unit {
      font-size: 12px;
      opacity: .7;
    }

    .trend {
      font-size: 22px;
      line-height: 1;
    }

    .freshness {
      font-size: 10px;
      opacity: .65;
      white-space: nowrap;
    }

    .freshness.stale,
    .freshness.error {
      color: #f57c00;
      opacity: 1;
    }

    .stats-group {
      flex: 1;
      display: flex;
      justify-content: space-around;
      gap: 18px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .label {
      font-size: 10px;
      opacity: .6;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      opacity: .7;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="content" class="empty">
    ...
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const trendMap = {
        falling_quickly: '↓',
        falling: '↘',
        flat: '→',
        rising: '↗',
        rising_quickly: '↑',
        unknown: '–',
      };
      const translate = (key, fallback) => Homey.__(`widgets.${key}`) || fallback;

      function getUnitSettings() {
        const settings = Homey.getSettings();
        const unit = settings.glucose_unit || 'mgdl';

        return {
          unit,
          label: unit === 'mmol' ? 'mmol/L' : 'mg/dL',
          valueKey: unit === 'mmol' ? 'valueMmol' : 'valueMgDl',
          statSuffix: unit === 'mmol' ? 'Mmol' : 'MgDl',
          decimals: unit === 'mmol' ? 1 : 0,
        };
      }

      function formatValue(value, decimals) {
        if (!Number.isFinite(value)) return '–';
        return Number(value).toFixed(decimals);
      }

      function render(data) {
        const content = document.getElementById('content');
        const current = data.current;
        const stats = data.stats || {};
        const unitSettings = getUnitSettings();
        const readingTime = new Date(current?.timestamp).getTime();
        const ageMinutes = Number.isFinite(readingTime)
          ? Math.max(0, Math.floor((Date.now() - readingTime) / 60000))
          : null;
        const connectionError = data.status?.connectionError;
        const freshnessClass = connectionError
          ? 'error'
          : ageMinutes > 15 ? 'stale' : '';
        const freshnessText = connectionError
          ? translate('connection_error', 'Connection error')
          : ageMinutes === null
            ? ''
            : translate('minutes_ago', '__minutes__ min ago')
              .replace('__minutes__', ageMinutes);

        if (!current) {
          content.className = 'empty';
          content.textContent = translate('no_data', 'No glucose values available yet.');
          return;
        }

        content.className = '';

        content.innerHTML = `
          <div class="current">
            <div class="value-row">
              <span class="value">
                ${formatValue(current[unitSettings.valueKey], unitSettings.decimals)}
              </span>

              <span class="unit">
                ${unitSettings.label}
              </span>

              <span class="trend">
                ${trendMap[current.trend] || '–'}
              </span>
            </div>

            <div class="freshness ${freshnessClass}">
              ${freshnessText}
            </div>
          </div>

          <div class="stats-group">
            <div class="stat">
              <div class="label">${translate('min', 'Min')}</div>
              <div class="stat-value">
                ${formatValue(stats[`min${unitSettings.statSuffix}`], unitSettings.decimals)}
              </div>
            </div>

            <div class="stat">
              <div class="label">${translate('average', 'Avg')}</div>
              <div class="stat-value">
                ${formatValue(stats[`avg${unitSettings.statSuffix}`], unitSettings.decimals)}
              </div>
            </div>

            <div class="stat">
              <div class="label">${translate('max', 'Max')}</div>
              <div class="stat-value">
                ${formatValue(stats[`max${unitSettings.statSuffix}`], unitSettings.decimals)}
              </div>
            </div>
            <div class="stat">
              <div class="label">${translate('time_in_range', 'In range')}</div>
              <div class="stat-value">${Number.isFinite(data.timeInRange?.inRangePercent) ? `${data.timeInRange.inRangePercent}%` : '–'}</div>
            </div>
          </div>
        `;
      }

      async function refresh() {
        try {
          const deviceIds = await Homey.getDeviceIds();

          const deviceId =
            Array.isArray(deviceIds)
              ? deviceIds[0]
              : deviceIds;

          const data = await Homey.api(
            'GET',
            `/getGlucoseHistory?deviceId=${encodeURIComponent(deviceId || '')}`
          );

          render(data);
        } catch (err) {
          const content = document.getElementById('content');
          content.className = 'empty';
          content.textContent = translate('connection_error', 'Connection error');
        }
      }

      Homey.ready();

      document.getElementById('content').textContent =
        translate('loading', 'Loading glucose values...');
      refresh();

      Homey.on('settings', () => {
        refresh();
      });

      setInterval(refresh, 60 * 1000);
    }
  </script>

  <script src="/homey.js" data-origin="widget"></script>
</body>
</html>
